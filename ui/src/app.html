<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NullHub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <script>
      (function () {
        var host = window.location.hostname;
        if (host === 'localhost') return;
        if (host === 'nullhub.localhost' || host === 'nullhub.local' || host === '127.0.0.1') {
          var port = window.location.port ? ':' + window.location.port : '';
          window.location.replace(
            window.location.protocol +
              '//localhost' +
              port +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <!-- preload-code="eager" fetches every visible link's route chunk at startup,
       so sidebar navigation never waits on the network (or a busy backend). -->
  <body data-sveltekit-prerender="false" data-sveltekit-preload-code="eager" class="theme-light effects-disabled">
    <script>
      try {
        var theme = localStorage.getItem('nullhub-theme');
        var effects = localStorage.getItem('nullhub-effects');
        if (theme) {
          document.body.classList.replace('theme-light', theme);
          document.documentElement.classList.add(theme);
        }
        if (effects === 'true') document.body.classList.remove('effects-disabled');
      } catch (e) {}
    </script>
    %sveltekit.body%
  </body>
</html>
